server:
  port: 8079

spring:
  application:
    name: clinical-service

  datasource:
    url: jdbc:mysql://localhost:3306/clinical_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  ai:
    openai:
      api-key: ${GEMINI_API_KEY:}
      enabled: true
      chat:
        options:
          model: gemini-2.5-flash

user:
  service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8082/api/users}