spring.application.name=clinical-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server.port=8079

spring.datasource.url=jdbc:mysql://localhost:3306/clinical_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

user.service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8082/api/users}

spring.ai.openai.enabled=true
spring.ai.openai.api-key=${GEMINI_API_KEY:}

server.error.include-message=always
server.error.include-stacktrace=always

spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8180/realms/nephro-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8180/realms/nephro-realm/protocol/openid-connect/certs}
