apiVersion: v1
kind: Service
metadata:
  name: hospitalization-service
  namespace: nephrocare
spec:
  selector:
    app: hospitalization-service
  ports:
    - name: http
      port: 8076
      targetPort: 8076
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: nephrocare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: nephrocare/order-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8089
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
            - name: PHARMACY_SERVICE_BASE_URL
              value: http://pharmacy-service:8087
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: MYSQL_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: MYSQL_PASSWORD
          envFrom:
            - configMapRef:
                name: nephrocare-common
            - secretRef:
                name: nephrocare-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: nephrocare
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8089
      targetPort: 8089
---
