---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: nephrocare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: copy-realm
          image: busybox:1.36
          env:
            - name: DIALYSIS_KC_SECRET
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: DIALYSIS_KC_SECRET
            - name: DEMO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: DEMO_ADMIN_PASSWORD
            - name: DEMO_DOCTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: DEMO_DOCTOR_PASSWORD
            - name: DEMO_NURSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: DEMO_NURSE_PASSWORD
            - name: DEMO_PATIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: DEMO_PATIENT_PASSWORD
            - name: DEMO_PHARMACIST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: DEMO_PHARMACIST_PASSWORD
            - name: DEMO_LABTECH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: DEMO_LABTECH_PASSWORD
            - name: DEMO_DRIVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: DEMO_DRIVER_PASSWORD
            - name: FRONT_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: nephrocare-common
                  key: FRONT_ORIGIN
            - name: BACK_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: nephrocare-common
                  key: BACK_ORIGIN
          command:
            - sh
            - -c
            - |
              sed \
                -e "s#__DIALYSIS_KC_SECRET__#${DIALYSIS_KC_SECRET}#g" \
                -e "s#__DEMO_ADMIN_PASSWORD__#${DEMO_ADMIN_PASSWORD}#g" \
                -e "s#__DEMO_DOCTOR_PASSWORD__#${DEMO_DOCTOR_PASSWORD}#g" \
                -e "s#__DEMO_NURSE_PASSWORD__#${DEMO_NURSE_PASSWORD}#g" \
                -e "s#__DEMO_PATIENT_PASSWORD__#${DEMO_PATIENT_PASSWORD}#g" \
                -e "s#__DEMO_PHARMACIST_PASSWORD__#${DEMO_PHARMACIST_PASSWORD}#g" \
                -e "s#__DEMO_LABTECH_PASSWORD__#${DEMO_LABTECH_PASSWORD}#g" \
                -e "s#__DEMO_DRIVER_PASSWORD__#${DEMO_DRIVER_PASSWORD}#g" \
                -e "s#__FRONT_ORIGIN__#${FRONT_ORIGIN}#g" \
                -e "s#__BACK_ORIGIN__#${BACK_ORIGIN}#g" \
                /realm/nephro-realm-import.json > /import/nephro-realm-import.json
          volumeMounts:
            - name: realm-source
              mountPath: /realm
              readOnly: true
            - name: realm-import
              mountPath: /import
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          args: ["start-dev", "--http-port=8180", "--import-realm"]
          ports:
            - containerPort: 8180
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm-source
          configMap:
            name: keycloak-realm-import
        - name: realm-import
          emptyDir: {}
---
