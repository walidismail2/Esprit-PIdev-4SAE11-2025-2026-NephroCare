apiVersion: apps/v1
kind: Deployment
metadata:
  name: kidney-ai
  namespace: nephrocare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kidney-ai
  template:
    metadata:
      labels:
        app: kidney-ai
    spec:
      containers:
        - name: kidney-ai
          image: nephrocare/kidney-ai:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /models/best_cnn_kidney.keras
          volumeMounts:
            - name: kidney-model
              mountPath: /models
              readOnly: true
      volumes:
        - name: kidney-model
          hostPath:
            # Docker Desktop path for this workspace. Change it if the project folder moves.
            path: "/run/desktop/mnt/host/c/Users/mrspe/OneDrive/Bureau/Esprit-PIdev-4SAE11-2025-2026-NephroCare/Kidney Project IA/kidney_model_improved"
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: kidney-ai
  namespace: nephrocare
spec:
  selector:
    app: kidney-ai
  ports:
    - name: http
      port: 8000
      targetPort: 8000
