apiVersion: v1
kind: Namespace
metadata:
  name: nephrocare
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nephrocare-common
  namespace: nephrocare
data:
  SPRING_PROFILES_ACTIVE: docker
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
  CONFIG_SERVER_URL: http://config-server:8888
  KEYCLOAK_URL: http://keycloak:8180
  KEYCLOAK_REALM_ISSUER: http://localhost:8180/realms/nephro-realm
  KEYCLOAK_JWK_SET_URI: http://keycloak:8180/realms/nephro-realm/protocol/openid-connect/certs
  CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:4369
  FRONT_ORIGIN: http://localhost:4200
  BACK_ORIGIN: http://localhost:4369
  PUBLIC_API_URL: http://localhost:8070
  PUBLIC_KEYCLOAK_URL: http://localhost:8180
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/nephro-realm
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/nephro-realm/protocol/openid-connect/certs
  # Prevent microservices from crashing if MySQL isn't ready yet.
  # (HikariCP will keep retrying instead of failing fast.)
  SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT: "-1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-sql
  namespace: nephrocare
data:
  01-create-databases.sql: |
    CREATE DATABASE IF NOT EXISTS nephro_users_db;
    CREATE DATABASE IF NOT EXISTS clinical_db;
    CREATE DATABASE IF NOT EXISTS hospitalization_db;
    CREATE DATABASE IF NOT EXISTS diagnostic_db;
    CREATE DATABASE IF NOT EXISTS dialysis_db;
    CREATE DATABASE IF NOT EXISTS pharmacy_db;
    CREATE DATABASE IF NOT EXISTS order_db;
    CREATE DATABASE IF NOT EXISTS monitoring_db;

    GRANT ALL PRIVILEGES ON nephro_users_db.* TO 'nephro'@'%';
    GRANT ALL PRIVILEGES ON clinical_db.* TO 'nephro'@'%';
    GRANT ALL PRIVILEGES ON hospitalization_db.* TO 'nephro'@'%';
    GRANT ALL PRIVILEGES ON diagnostic_db.* TO 'nephro'@'%';
    GRANT ALL PRIVILEGES ON dialysis_db.* TO 'nephro'@'%';
    GRANT ALL PRIVILEGES ON pharmacy_db.* TO 'nephro'@'%';
    GRANT ALL PRIVILEGES ON order_db.* TO 'nephro'@'%';
    GRANT ALL PRIVILEGES ON monitoring_db.* TO 'nephro'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: nephrocare
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: nephrocare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nephrocare-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              value: mysql
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-init
          configMap:
            name: mysql-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: nephrocare
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  namespace: nephrocare
data:
  nephro-realm-import.json: |
    {
      "realm": "nephro-realm",
      "enabled": true,
      "displayName": "NephroCare Realm",
      "registrationAllowed": false,
      "resetPasswordAllowed": true,
      "rememberMe": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "roles": {
        "realm": [
          { "name": "admin", "description": "Administrator" },
          { "name": "doctor", "description": "Doctor" },
          { "name": "nurse", "description": "Nurse" },
          { "name": "pharmacist", "description": "Pharmacist" },
          { "name": "lab-tech", "description": "Lab technician" },
          { "name": "driver", "description": "Delivery driver" },
          { "name": "patient", "description": "Patient" }
        ]
      },
      "clients": [
        {
          "clientId": "dialysis-service",
          "name": "Dialysis Service",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "secret": "__DIALYSIS_KC_SECRET__",
          "redirectUris": [ "*" ],
          "webOrigins": [ "*" ]
        },
        {
          "clientId": "backoffice-ui",
          "name": "Backoffice UI",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "__BACK_ORIGIN__/*",
            "__FRONT_ORIGIN__/*"
          ],
          "webOrigins": [
            "__BACK_ORIGIN__",
            "__FRONT_ORIGIN__"
          ]
        },
        {
          "clientId": "nephro-client",
          "name": "Nephro Client",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "__BACK_ORIGIN__/*",
            "__FRONT_ORIGIN__/*"
          ],
          "webOrigins": [
            "__BACK_ORIGIN__",
            "__FRONT_ORIGIN__"
          ]
        }
      ],
      "users": [
        {
          "username": "admin.user",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Admin",
          "lastName": "User",
          "email": "admin@nephrocare.local",
          "credentials": [
            { "type": "password", "value": "__DEMO_ADMIN_PASSWORD__", "temporary": false }
          ],
          "realmRoles": [ "admin" ]
        },
        {
          "username": "doctor.user",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Doctor",
          "lastName": "User",
          "email": "doctor@nephrocare.local",
          "credentials": [
            { "type": "password", "value": "__DEMO_DOCTOR_PASSWORD__", "temporary": false }
          ],
          "realmRoles": [ "doctor" ]
        },
        {
          "username": "nurse.user",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Nurse",
          "lastName": "User",
          "email": "nurse@nephrocare.local",
          "credentials": [
            { "type": "password", "value": "__DEMO_NURSE_PASSWORD__", "temporary": false }
          ],
          "realmRoles": [ "nurse" ]
        },
        {
          "username": "patient.user",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Patient",
          "lastName": "User",
          "email": "patient@nephrocare.local",
          "credentials": [
            { "type": "password", "value": "__DEMO_PATIENT_PASSWORD__", "temporary": false }
          ],
          "realmRoles": [ "patient" ]
        },
        {
          "username": "pharmacist.user",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Pharmacist",
          "lastName": "User",
          "email": "pharmacist@nephrocare.local",
          "credentials": [
            { "type": "password", "value": "__DEMO_PHARMACIST_PASSWORD__", "temporary": false }
          ],
          "realmRoles": [ "pharmacist" ]
        },
        {
          "username": "labtech.user",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Lab",
          "lastName": "Tech",
          "email": "labtech@nephrocare.local",
          "credentials": [
            { "type": "password", "value": "__DEMO_LABTECH_PASSWORD__", "temporary": false }
          ],
          "realmRoles": [ "lab-tech" ]
        },
        {
