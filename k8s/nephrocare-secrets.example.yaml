# Copy to k8s/nephrocare-secrets.yaml, replace every CHANGE_ME, then apply.
# That file is gitignored. Use letters and numbers only so the Keycloak import can substitute them.
# Rotate these values before any shared or public deploy.
apiVersion: v1
kind: Secret
metadata:
  name: nephrocare-secrets
  namespace: nephrocare
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: CHANGE_ME_ROOT
  MYSQL_USER: nephro
  MYSQL_PASSWORD: CHANGE_ME_DB
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: CHANGE_ME_KEYCLOAK
  DIALYSIS_KC_SECRET: CHANGE_ME_DIALYSIS_CLIENT
  DEMO_ADMIN_PASSWORD: CHANGE_ME_ADMIN
  DEMO_DOCTOR_PASSWORD: CHANGE_ME_DOCTOR
  DEMO_NURSE_PASSWORD: CHANGE_ME_NURSE
  DEMO_PATIENT_PASSWORD: CHANGE_ME_PATIENT
  DEMO_PHARMACIST_PASSWORD: CHANGE_ME_PHARMACIST
  DEMO_LABTECH_PASSWORD: CHANGE_ME_LABTECH
  DEMO_DRIVER_PASSWORD: CHANGE_ME_DRIVER
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: admin
  GF_SECURITY_ADMIN_PASSWORD: CHANGE_ME_GRAFANA
